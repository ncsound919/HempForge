version: "3.9"

services:
  mem0:
    build:
      context: ./mem0-main/server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - MEM0_CONFIG_PATH=/etc/mem0/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${MEM0_LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL:-text-embedding-3-small}
      - HISTORY_DB_PATH=/data/mem0/history.db
      - PGVECTOR_HOST=postgres
      - PGVECTOR_PORT=5432
      - PGVECTOR_DB=mem0
      - PGVECTOR_USER=mem0
      - PGVECTOR_PASSWORD=${MEM0_PGVECTOR_PASSWORD:-mem0_secret}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${MEM0_NEO4J_PASSWORD:-mem0_secret}
    volumes:
      - mem0-data:/data/mem0
      - ./mem0-config.yaml:/etc/mem0/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=mem0
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=${MEM0_PGVECTOR_PASSWORD:-mem0_secret}
    ports:
      - "8432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${MEM0_NEO4J_PASSWORD:-mem0_secret}
    ports:
      - "8474:7474"
      - "8687:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  mem0-data:
  pgvector-data:
  neo4j-data:
