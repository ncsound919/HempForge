services:
  researchclaw:
    build:
      context: ./researchclaw
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RC_CONFIG_PATH=/etc/researchclaw/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - S2_API_KEY=${S2_API_KEY:-}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - researchclaw-artifacts:/app/artifacts
      - ./researchclaw-config.yaml:/etc/researchclaw/config.yaml:ro
      - ./researchclaw:/app/researchclaw:ro
    command: >
      sh -c "cd /app && python3 -m pip install -e . && uvicorn researchclaw.server.app:create_app --host 0.0.0.0 --port 8080 --factory"
    restart: unless-stopped

volumes:
  researchclaw-artifacts:
