project:
  name: HempForge
  mode: full-auto

research:
  topic: Cannabinoid biosynthesis, extraction optimization, and pharmacological characterization
  domains:
    - cannabinoid_chemistry
    - hemp_agronomy
    - phytocannabinoid_pharmacology
    - analytical_chemistry
    - extraction_engineering
  daily_paper_count: 30
  quality_threshold: 0.5
  graceful_degradation: true

runtime:
  timezone: UTC
  max_parallel_tasks: 3
  approval_timeout_hours: 0
  retry_limit: 2

notifications:
  channel: log
  on_stage_start: false
  on_stage_fail: true
  on_gate_required: false

knowledge_base:
  backend: markdown
  root: artifacts/knowledge_base

llm:
  provider: openai-compatible
  base_url: https://api.openai.com/v1
  wire_api: chat_completions
  api_key_env: OPENAI_API_KEY
  primary_model: gpt-4o
  s2_api_key_env: S2_API_KEY
  timeout_sec: 600

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: simulated
  time_budget_sec: 600
  max_iterations: 5
  metric_key: primary_metric
  metric_direction: maximize

web_search:
  enabled: true
  tavily_api_key_env: TAVILY_API_KEY
  enable_scholar: true
  max_web_results: 15
  max_scholar_results: 15

export:
  target_conference: neurips_2025
  authors: HempForge Research

server:
  enabled: true
  host: 0.0.0.0
  port: 8080
  cors_origins:
    - "*"

dashboard:
  enabled: true
  refresh_interval_sec: 5
  max_log_lines: 1000

copilot:
  mode: zero-touch
  pause_at_gates: false
  pause_at_every_stage: false
  feedback_timeout_sec: 30

memory:
  enabled: true
  store_dir: artifacts/.researchclaw/memory
  inject_at_stages:
    - 1
    - 9
    - 10
    - 17

skills:
  enabled: true
  auto_match: true
  max_skills_per_stage: 3

trends:
  enabled: true
  domains:
    - cannabinoid_chemistry
    - hemp_agronomy
  daily_digest: true
  max_papers_per_day: 30
  sources:
    - pubmed
    - semantic_scholar
    - openalex

quality_assessor:
  enabled: true
  dimensions:
    - novelty
    - rigor
    - clarity
    - impact
    - experiments
